<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記事校正システム | Webライター向け自動校正ツール</title>
    <meta name="description" content="Webライターが執筆した記事をAIで自動校正。禁止表現・エビデンス不足・他社批判などを色付きハイライトで視覚的に表示します。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ─── リセット & ベース ─────────────────────────── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #0f1117;
            --color-surface: #1a1d27;
            --color-surface-hover: #232736;
            --color-border: #2a2e3d;
            --color-border-focus: #5b6eae;
            --color-text: #e4e6ed;
            --color-text-muted: #8b8fa5;
            --color-accent: #6c7ee1;
            --color-accent-hover: #8190e8;

            --color-prohibited: rgba(255, 107, 107, 0.25);
            --color-prohibited-border: #FF6B6B;
            --color-evidence: rgba(255, 217, 61, 0.20);
            --color-evidence-border: #FFD93D;
            --color-competitor: rgba(255, 154, 60, 0.22);
            --color-competitor-border: #FF9A3C;
            --color-harmful: rgba(255, 154, 60, 0.22);
            --color-harmful-border: #FF9A3C;

            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Noto Sans JP', sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.7;
            min-height: 100vh;
        }

        /* ─── ヘッダー ────────────────────────────────── */
        .header {
            background: linear-gradient(135deg, #1a1d27 0%, #1e2235 100%);
            border-bottom: 1px solid var(--color-border);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--color-accent), #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .header p {
            font-size: 13px;
            color: var(--color-text-muted);
            margin-top: 2px;
        }

        /* ─── メインレイアウト ─────────────────────────── */
        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            height: calc(100vh - 81px);
        }

        .panel {
            padding: 24px;
            overflow-y: auto;
        }

        .panel-left {
            border-right: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
        }

        .panel-right {
            background: #13151d;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: var(--color-accent);
            border-radius: 2px;
        }

        .char-count {
            font-size: 12px;
            color: var(--color-text-muted);
            font-variant-numeric: tabular-nums;
        }

        /* ─── テキストエリア ──────────────────────────── */
        .textarea-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        #input-text {
            flex: 1;
            min-height: 500px;
            width: 100%;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            color: var(--color-text);
            font-family: var(--font);
            font-size: 15px;
            line-height: 2.0;
            padding: 20px;
            resize: none;
            outline: none;
            transition: border-color var(--transition);
        }

        #input-text:focus {
            border-color: var(--color-border-focus);
        }

        #input-text::placeholder {
            color: var(--color-text-muted);
            opacity: 0.6;
        }

        /* ─── ボタン ─────────────────────────────────── */
        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            flex-shrink: 0;
        }

        .btn-proofread {
            background: linear-gradient(135deg, var(--color-accent), #8b5cf6);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.03em;
        }

        .btn-proofread:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(108, 126, 225, 0.35);
        }

        .btn-proofread:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-proofread:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-clear {
            background: transparent;
            color: var(--color-text-muted);
            border: 1px solid var(--color-border);
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-clear:hover {
            background: var(--color-surface-hover);
            color: var(--color-text);
        }

        /* ─── ローディング ────────────────────────────── */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15, 17, 23, 0.85);
            backdrop-filter: blur(4px);
            border-radius: var(--radius);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-overlay .spinner-large {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(108, 126, 225, 0.2);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-overlay p {
            color: var(--color-text-muted);
            font-size: 14px;
        }

        /* ─── 結果エリア ──────────────────────────────── */
        .result-container {
            position: relative;
            min-height: 300px;
        }

        .result-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: var(--color-text-muted);
            text-align: center;
            gap: 12px;
        }

        .result-placeholder .icon {
            font-size: 48px;
            opacity: 0.3;
        }

        .result-placeholder p {
            font-size: 14px;
            line-height: 1.8;
        }

        #result-content {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 24px;
            line-height: 2.2;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* ─── ハイライト ──────────────────────────────── */
        .highlight {
            padding: 2px 4px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all var(--transition);
            border-bottom: 2px solid transparent;
        }

        .highlight:hover {
            filter: brightness(1.2);
        }

        .highlight-PROHIBITED {
            background: var(--color-prohibited);
            border-bottom-color: var(--color-prohibited-border);
        }

        .highlight-EVIDENCE {
            background: var(--color-evidence);
            border-bottom-color: var(--color-evidence-border);
        }

        .highlight-COMPETITOR {
            background: var(--color-competitor);
            border-bottom-color: var(--color-competitor-border);
        }

        .highlight-HARMFUL {
            background: var(--color-harmful);
            border-bottom-color: var(--color-harmful-border);
        }

        /* ─── ツールチップ ────────────────────────────── */
        .tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: #252838;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            min-width: 280px;
            max-width: 400px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: tooltipIn 0.15s ease-out;
        }

        @keyframes tooltipIn {
            from { opacity: 0; transform: translateX(-50%) translateY(4px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: #252838;
        }

        .tooltip.active {
            display: block;
        }

        .tooltip-type {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .tooltip-type-PROHIBITED {
            background: rgba(255, 107, 107, 0.2);
            color: #FF6B6B;
        }

        .tooltip-type-EVIDENCE {
            background: rgba(255, 217, 61, 0.2);
            color: #FFD93D;
        }

        .tooltip-type-COMPETITOR {
            background: rgba(255, 154, 60, 0.2);
            color: #FF9A3C;
        }

        .tooltip-type-HARMFUL {
            background: rgba(255, 154, 60, 0.2);
            color: #FF9A3C;
        }

        .tooltip-message {
            font-size: 13px;
            color: var(--color-text);
            line-height: 1.7;
            margin-bottom: 4px;
        }

        .tooltip-suggestion {
            font-size: 13px;
            color: #8be9a0;
            background: rgba(139, 233, 160, 0.08);
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
            line-height: 1.7;
        }

        .tooltip-suggestion::before {
            content: '💡 修正案: ';
            font-weight: 600;
        }

        /* ─── サマリーバー ────────────────────────────── */
        .summary-bar {
            display: none;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .summary-bar.active {
            display: flex;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--color-text-muted);
            background: var(--color-surface);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
        }

        .summary-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .summary-dot-PROHIBITED { background: var(--color-prohibited-border); }
        .summary-dot-EVIDENCE   { background: var(--color-evidence-border); }
        .summary-dot-COMPETITOR { background: var(--color-competitor-border); }
        .summary-dot-HARMFUL    { background: var(--color-harmful-border); }

        .summary-count {
            font-weight: 700;
            color: var(--color-text);
            font-variant-numeric: tabular-nums;
        }

        /* ─── エラーメッセージ ────────────────────────── */
        .error-message {
            display: none;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            margin-top: 12px;
            font-size: 14px;
            color: #ff9b9b;
            line-height: 1.7;
        }

        .error-message.active {
            display: block;
        }

        /* ─── 成功メッセージ ──────────────────────────── */
        .success-message {
            display: none;
            background: rgba(139, 233, 160, 0.08);
            border: 1px solid rgba(139, 233, 160, 0.25);
            border-radius: var(--radius);
            padding: 32px;
            text-align: center;
            margin-top: 20px;
        }

        .success-message.active {
            display: block;
        }

        .success-message .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .success-message p {
            color: #8be9a0;
            font-size: 15px;
            font-weight: 500;
        }

        .success-message .sub {
            color: var(--color-text-muted);
            font-size: 13px;
            font-weight: 400;
            margin-top: 4px;
        }

        /* ─── 詳細パネル ──────────────────────────────── */
        .detail-panel {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 400px;
            height: 100vh;
            background: #1e2130;
            border-left: 1px solid var(--color-border);
            z-index: 200;
            box-shadow: -8px 0 32px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.25s ease-out;
            flex-direction: column;
        }

        .detail-panel.active {
            display: flex;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to   { transform: translateX(0); }
        }

        .detail-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
        }

        .detail-panel-header h3 {
            font-size: 15px;
            font-weight: 600;
        }

        .detail-panel-close {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--color-surface);
            color: var(--color-text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }

        .detail-panel-close:hover {
            background: var(--color-surface-hover);
            color: var(--color-text);
        }

        .detail-panel-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .detail-item {
            padding: 16px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .detail-item:hover {
            background: var(--color-surface-hover);
            border-color: var(--color-border-focus);
        }

        .detail-item-type {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .detail-item-original {
            font-size: 14px;
            color: var(--color-text);
            line-height: 1.8;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid var(--color-border);
        }

        .detail-item-message {
            font-size: 13px;
            color: var(--color-text-muted);
            line-height: 1.7;
        }

        .detail-item-suggestion {
            font-size: 13px;
            color: #8be9a0;
            background: rgba(139, 233, 160, 0.08);
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 10px;
            line-height: 1.7;
        }

        .detail-item-suggestion::before {
            content: '💡 修正案: ';
            font-weight: 600;
        }

        /* ─── 背景オーバーレイ ────────────────────────── */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 199;
        }

        .overlay.active {
            display: block;
        }

        /* ─── 警告メッセージ ──────────────────────────── */
        .warning-message {
            display: none;
            background: rgba(255, 217, 61, 0.08);
            border: 1px solid rgba(255, 217, 61, 0.25);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #FFD93D;
            line-height: 1.6;
        }

        .warning-message.active {
            display: block;
        }

        /* ─── レスポンシブ ────────────────────────────── */
        @media (max-width: 1024px) {
            .main {
                grid-template-columns: 1fr;
                height: auto;
            }

            .panel-left {
                border-right: none;
                border-bottom: 1px solid var(--color-border);
            }

            #input-text {
                min-height: 300px;
            }

            .detail-panel {
                width: 100%;
            }
        }

        /* ─── スクロールバー ──────────────────────────── */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-text-muted);
        }
    </style>
</head>
<body>
    <!-- ヘッダー -->
    <header class="header">
        <div class="header-icon">✍️</div>
        <div>
            <h1>記事校正システム</h1>
            <p>AIが記事の問題箇所を検出し、修正案を提案します</p>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="main">
        <!-- 左カラム: 入力エリア -->
        <div class="panel panel-left">
            <div class="panel-header">
                <span class="panel-title">入力テキスト</span>
                <span class="char-count" id="char-count">0 文字</span>
            </div>
            <div class="textarea-wrapper">
                <textarea
                    id="input-text"
                    placeholder="校正したい記事テキストをここに貼り付けてください..."
                ></textarea>
            </div>
            <div class="actions">
                <button class="btn-proofread" id="btn-proofread" onclick="proofread()">
                    <span class="spinner" id="btn-spinner"></span>
                    <span id="btn-text">校正する</span>
                </button>
                <button class="btn-clear" onclick="clearAll()">クリア</button>
            </div>
            <div class="error-message" id="error-message"></div>
        </div>

        <!-- 右カラム: 結果エリア -->
        <div class="panel panel-right">
            <div class="panel-header">
                <span class="panel-title">校正結果</span>
                <span class="char-count" id="issue-count"></span>
            </div>

            <!-- サマリーバー -->
            <div class="summary-bar" id="summary-bar">
                <div class="summary-item">
                    <span class="summary-dot summary-dot-PROHIBITED"></span>
                    禁止表現 <span class="summary-count" id="count-prohibited">0</span>
                </div>
                <div class="summary-item">
                    <span class="summary-dot summary-dot-EVIDENCE"></span>
                    エビデンス不足 <span class="summary-count" id="count-evidence">0</span>
                </div>
                <div class="summary-item">
                    <span class="summary-dot summary-dot-COMPETITOR"></span>
                    他社批判 <span class="summary-count" id="count-competitor">0</span>
                </div>
                <div class="summary-item">
                    <span class="summary-dot summary-dot-HARMFUL"></span>
                    有害表現 <span class="summary-count" id="count-harmful">0</span>
                </div>
            </div>

            <!-- 警告メッセージ -->
            <div class="warning-message" id="warning-message"></div>

            <!-- 結果コンテンツ -->
            <div class="result-container" id="result-container">
                <div class="result-placeholder" id="result-placeholder">
                    <div class="icon">📝</div>
                    <p>左のテキストエリアに記事を入力し、<br>「校正する」ボタンを押してください</p>
                </div>
                <div id="result-content" style="display:none;"></div>
                <div class="success-message" id="success-message">
                    <div class="icon">✅</div>
                    <p>問題は検出されませんでした</p>
                    <p class="sub">記事は執筆ルールに準拠しています</p>
                </div>

                <!-- ローディングオーバーレイ -->
                <div class="loading-overlay" id="loading-overlay">
                    <div class="spinner-large"></div>
                    <p>AIが記事を分析しています...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 詳細パネル -->
    <div class="overlay" id="overlay" onclick="closeDetailPanel()"></div>
    <div class="detail-panel" id="detail-panel">
        <div class="detail-panel-header">
            <h3>検出された問題一覧</h3>
            <button class="detail-panel-close" onclick="closeDetailPanel()">✕</button>
        </div>
        <div class="detail-panel-body" id="detail-panel-body"></div>
    </div>

    <script>
        // ─── 状態管理 ─────────────────────────────────────
        let currentIssues = [];
        let activeTooltip = null;

        // ─── 文字数カウント ───────────────────────────────
        const inputText = document.getElementById('input-text');
        const charCount = document.getElementById('char-count');

        inputText.addEventListener('input', () => {
            charCount.textContent = `${inputText.value.length.toLocaleString()} 文字`;
        });

        // ─── 優先度マップ ─────────────────────────────────
        const PRIORITY = { PROHIBITED: 4, HARMFUL: 3, COMPETITOR: 2, EVIDENCE: 1 };
        const TYPE_LABELS = {
            PROHIBITED: '禁止表現',
            EVIDENCE: 'エビデンス不足',
            COMPETITOR: '他社批判の可能性',
            HARMFUL: '有害表現の可能性'
        };
        const TYPE_MESSAGES = {
            EVIDENCE: 'エビデンスの引用を検討してください。',
            COMPETITOR: '他社批判の可能性があります。修正を検討してください。',
            HARMFUL: '読んだ人が傷つく表現の可能性があります。修正を検討してください。'
        };

        // ─── 校正実行 ─────────────────────────────────────
        async function proofread() {
            const text = inputText.value.trim();
            if (!text) {
                showError('校正するテキストを入力してください。');
                return;
            }

            setLoading(true);
            hideError();

            try {
                const response = await fetch('/api/proofread', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || `サーバーエラー (${response.status})`);
                }

                const data = await response.json();

                if (data.warning) {
                    document.getElementById('warning-message').textContent = '⚠️ ' + data.warning;
                    document.getElementById('warning-message').classList.add('active');
                }

                currentIssues = data.issues || [];
                renderResult(text, currentIssues);

            } catch (error) {
                showError(error.message || '校正中にエラーが発生しました。もう一度お試しください。');
            } finally {
                setLoading(false);
            }
        }

        // ─── 結果のレンダリング ───────────────────────────
        function renderResult(text, issues) {
            const placeholder = document.getElementById('result-placeholder');
            const resultContent = document.getElementById('result-content');
            const summaryBar = document.getElementById('summary-bar');
            const successMessage = document.getElementById('success-message');
            const issueCount = document.getElementById('issue-count');

            placeholder.style.display = 'none';
            document.getElementById('warning-message').classList.remove('active');

            if (issues.length === 0) {
                resultContent.style.display = 'none';
                successMessage.classList.add('active');
                summaryBar.classList.remove('active');
                issueCount.textContent = '';
                return;
            }

            successMessage.classList.remove('active');
            resultContent.style.display = 'block';
            summaryBar.classList.add('active');

            // サマリー更新
            const counts = { PROHIBITED: 0, EVIDENCE: 0, COMPETITOR: 0, HARMFUL: 0 };
            issues.forEach(i => { if (counts[i.type] !== undefined) counts[i.type]++; });
            document.getElementById('count-prohibited').textContent = counts.PROHIBITED;
            document.getElementById('count-evidence').textContent = counts.EVIDENCE;
            document.getElementById('count-competitor').textContent = counts.COMPETITOR;
            document.getElementById('count-harmful').textContent = counts.HARMFUL;
            issueCount.textContent = `${issues.length} 件の問題を検出`;

            // 優先度でソート（高い優先度のものを後に処理して上書きするため昇順）
            const sortedIssues = [...issues].sort(
                (a, b) => (PRIORITY[a.type] || 0) - (PRIORITY[b.type] || 0)
            );

            // テキストにハイライトを適用
            let html = escapeHtml(text);

            sortedIssues.forEach((issue, index) => {
                const escapedOriginal = escapeHtml(issue.original_text);
                if (!escapedOriginal) return;

                const typeClass = `highlight-${issue.type}`;
                const message = issue.message || TYPE_MESSAGES[issue.type] || '';
                const suggestion = issue.suggestion || '';
                const typeLabel = TYPE_LABELS[issue.type] || issue.type;

                const replacement = `<span class="highlight ${typeClass}" `
                    + `data-type="${issue.type}" `
                    + `data-message="${escapeAttr(message)}" `
                    + `data-suggestion="${escapeAttr(suggestion)}" `
                    + `data-label="${escapeAttr(typeLabel)}" `
                    + `data-index="${index}" `
                    + `onmouseenter="showTooltip(this)" `
                    + `onmouseleave="hideTooltip(this)" `
                    + `onclick="openDetailPanel()">`
                    + `${escapedOriginal}</span>`;

                // 最初の一致のみ置換（重複防止）
                const pos = html.indexOf(escapedOriginal);
                if (pos !== -1) {
                    html = html.substring(0, pos) + replacement + html.substring(pos + escapedOriginal.length);
                }
            });

            // 改行を <br> に変換
            html = html.replace(/\n/g, '<br>');

            resultContent.innerHTML = html;
        }

        // ─── ツールチップ表示 ─────────────────────────────
        function showTooltip(el) {
            hideAllTooltips();

            const type = el.dataset.type;
            const message = el.dataset.message;
            const suggestion = el.dataset.suggestion;
            const label = el.dataset.label;

            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip active';
            tooltip.innerHTML = `
                <div class="tooltip-type tooltip-type-${type}">${label}</div>
                <div class="tooltip-message">${escapeHtml(message)}</div>
                ${suggestion ? `<div class="tooltip-suggestion">${escapeHtml(suggestion)}</div>` : ''}
            `;

            el.style.position = 'relative';
            el.appendChild(tooltip);
            activeTooltip = tooltip;

            // 画面外にはみ出さないように位置調整
            requestAnimationFrame(() => {
                const rect = tooltip.getBoundingClientRect();
                if (rect.left < 10) {
                    tooltip.style.left = '0';
                    tooltip.style.transform = 'translateX(0)';
                }
                if (rect.right > window.innerWidth - 10) {
                    tooltip.style.left = 'auto';
                    tooltip.style.right = '0';
                    tooltip.style.transform = 'translateX(0)';
                }
                if (rect.top < 10) {
                    tooltip.style.bottom = 'auto';
                    tooltip.style.top = 'calc(100% + 10px)';
                }
            });
        }

        function hideTooltip(el) {
            const tooltip = el.querySelector('.tooltip');
            if (tooltip) tooltip.remove();
            activeTooltip = null;
        }

        function hideAllTooltips() {
            document.querySelectorAll('.tooltip').forEach(t => t.remove());
            activeTooltip = null;
        }

        // ─── 詳細パネル ───────────────────────────────────
        function openDetailPanel() {
            hideAllTooltips();

            const panel = document.getElementById('detail-panel');
            const overlay = document.getElementById('overlay');
            const body = document.getElementById('detail-panel-body');

            body.innerHTML = '';

            currentIssues.forEach((issue, index) => {
                const typeLabel = TYPE_LABELS[issue.type] || issue.type;
                const item = document.createElement('div');
                item.className = 'detail-item';
                item.innerHTML = `
                    <div class="detail-item-type tooltip-type-${issue.type}">${typeLabel}</div>
                    <div class="detail-item-original">${escapeHtml(issue.original_text)}</div>
                    <div class="detail-item-message">${escapeHtml(issue.message || TYPE_MESSAGES[issue.type] || '')}</div>
                    ${issue.suggestion ? `<div class="detail-item-suggestion">${escapeHtml(issue.suggestion)}</div>` : ''}
                `;

                // クリックで該当箇所にスクロール
                item.addEventListener('click', () => {
                    const highlights = document.querySelectorAll('.highlight');
                    highlights.forEach(h => {
                        if (h.dataset.message === issue.message && 
                            h.textContent === issue.original_text) {
                            h.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            h.style.outline = '2px solid #fff';
                            h.style.outlineOffset = '2px';
                            setTimeout(() => {
                                h.style.outline = '';
                                h.style.outlineOffset = '';
                            }, 2000);
                        }
                    });
                });

                body.appendChild(item);
            });

            panel.classList.add('active');
            overlay.classList.add('active');
        }

        function closeDetailPanel() {
            document.getElementById('detail-panel').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        // ─── UI ヘルパー ──────────────────────────────────
        function setLoading(isLoading) {
            const btn = document.getElementById('btn-proofread');
            const spinner = document.getElementById('btn-spinner');
            const btnText = document.getElementById('btn-text');
            const overlay = document.getElementById('loading-overlay');

            btn.disabled = isLoading;
            spinner.style.display = isLoading ? 'block' : 'none';
            btnText.textContent = isLoading ? '校正中...' : '校正する';
            overlay.classList.toggle('active', isLoading);
        }

        function showError(message) {
            const el = document.getElementById('error-message');
            el.textContent = '❌ ' + message;
            el.classList.add('active');
        }

        function hideError() {
            const el = document.getElementById('error-message');
            el.classList.remove('active');
        }

        function clearAll() {
            inputText.value = '';
            charCount.textContent = '0 文字';
            document.getElementById('result-content').style.display = 'none';
            document.getElementById('result-content').innerHTML = '';
            document.getElementById('result-placeholder').style.display = 'flex';
            document.getElementById('summary-bar').classList.remove('active');
            document.getElementById('success-message').classList.remove('active');
            document.getElementById('warning-message').classList.remove('active');
            document.getElementById('issue-count').textContent = '';
            hideError();
            currentIssues = [];
        }

        // ─── ユーティリティ ───────────────────────────────
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#39;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;');
        }

        // キーボードショートカット: Ctrl+Enter で校正実行
        inputText.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                proofread();
            }
        });

        // ESC で詳細パネルを閉じる
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDetailPanel();
            }
        });
    </script>
</body>
</html>
